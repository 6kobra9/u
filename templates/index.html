<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <button id="menuToggle" class="hamburger-btn" aria-label="Відкрити меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="logo">Управління беспілотних систем КСВ</div>
            </div>
            <div class="header-right">
            </div>
        </header>

        <!-- Бокова панель меню -->
        <div id="sidePanelBackdrop" class="side-panel-backdrop"></div>
        <aside id="sidePanel" class="side-panel">
            <div class="side-panel-header">
                <span class="side-panel-title">Меню</span>
                <button id="sidePanelClose" class="side-panel-close" aria-label="Закрити меню">&times;</button>
            </div>
            <nav class="side-nav">
                <div class="mega-menu-content">
                    <div class="mega-menu-column">
                        <h3 class="mega-menu-title">Структура</h3>
                        <ul class="mega-menu-list">
                            <li><a href="#">Загальна</a></li>
                            <li><a href="#">Структура НРК</a></li>
                            <li><a href="#" class="nav-link-disabled" data-enabled="false" title="Пункт тимчасово недоступний">Структура БПЛА</a></li>
                        </ul>
                    </div>
                    <div class="mega-menu-column">
                        <h3 class="mega-menu-title">ВО</h3>
                        <ul class="mega-menu-list">
                            <li><a href="#">ВО загальні</a></li>
                            <li><a href="#">ВО нрк</a></li>
                        </ul>
                    </div>
                    <div class="mega-menu-column">
                        <h3 class="mega-menu-title">Засоби</h3>
                        <ul class="mega-menu-list">
                            <li><a href="#">НРК</a></li>
                        </ul>
                    </div>
                    <div class="mega-menu-column">
                        <h3 class="mega-menu-title">Завантаження даних</h3>
                        <ul class="mega-menu-list">
                            <li><a href="#">довідник засобів</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </aside>

        <div class="main-content">
            <!-- Основна область -->
            <main class="content-area">
                <div id="dataPanel" class="data-panel" style="display: none;">
                    <div class="panel-header">
                        <h2 id="panelTitle">Дані</h2>
                        <div class="panel-actions">
                            <div id="viewToggleWrap" class="view-toggle-wrap" style="display: none;">
                                <span class="view-toggle-label">Вид:</span>
                                <button type="button" id="viewTableBtn" class="btn btn-toggle active">Таблиця</button>
                                <button type="button" id="viewTreeBtn" class="btn btn-toggle">Дерево</button>
                            </div>
                            <button id="exportExcelBtn" class="btn btn-secondary">Експорт в Excel</button>
                            <button id="addRowBtn" class="btn btn-primary">+ Додати рядок</button>
                        </div>
                    </div>
                    <div class="table-container" id="tableContainer">
                        <table id="dataTable" class="data-table">
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                    <div id="treeContainer" class="tree-container" style="display: none;">
                        <div class="tree-toolbar">
                            <button type="button" id="treeExpandAll" class="btn btn-tree-toggle">Розгорнути все</button>
                            <button type="button" id="treeCollapseAll" class="btn btn-tree-toggle">Згорнути все</button>
                        </div>
                        <div id="treeLoading" class="loading" style="display: none;">Завантаження дерева...</div>
                        <div id="structureTree" class="structure-tree"></div>
                    </div>
                    <div class="table-footer" id="tableFooter">
                        <span id="recordCount">Загальна кількість: 0</span>
                        <span id="filteredCount">Відфільтровано: 0</span>
                    </div>
                </div>
            </main>
        </div>

        <!-- Модальне вікно для редагування/додавання -->
        <div id="editModal" class="modal">
            <div class="modal-content edit-modal">
                <span class="close" id="closeEditModal">&times;</span>
                <h3 id="editModalTitle">Редагувати запис</h3>
                <form id="editForm">
                    <div id="editFields"></div>
                    <div class="modal-buttons">
                        <button type="submit" class="btn btn-primary">Зберегти</button>
                    </div>
                </form>
            </div>
        </div>

      
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="modalMessage"></div>
            </div>
        </div>
    </div>

    <!-- Бібліотека для формування XLSX-файлів з підтримкою стилів (жирний шрифт тощо) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
